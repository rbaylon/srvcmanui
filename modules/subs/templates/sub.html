{{define "title"}}Subscriber Form{{end}}
{{define "content"}}
 <form method="POST" action="/ui/subs/addorupdate">
   <div class="mb-3">
     <label class="form-label" for="basic-form-created">Date Created</label>
     <input class="form-control" id="basic-form-created" disabled="" placeholder="Leave Blank to use current date and time" name="CreatedAt" value="{{.CreatedAt}}"/>
     <input type="hidden" name="id" value="{{.ID}}" />
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-updated">Date updated</label>
     <input class="form-control" id="basic-form-updated" disabled=""  placeholder="Leave Blank to use current date and time" name="UpdatedAt" value="{{.UpdatedAt}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-fname">First Name</label>
     <input class="form-control" id="basic-form-fname" type="text" placeholder="First Name" name="first_name" value="{{.FirstName}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-lname">Last Name</label>
     <input class="form-control" id="basic-form-lname" type="text" placeholder="Last Name" name="last_name" value="{{.LastName}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-loc">Address</label>
     <input class="form-control" id="basic-form-loc" type="text" placeholder="Address" name="loc" value="{{.Loc}}">
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-ip">IP address</label>
     <input class="form-control" id="basic-form-ip" type="text" placeholder="192.0.2.100" name="framed_ip" value="{{.FramedIp}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-mac">Mac address</label>
     <input class="form-control" id="basic-form-mac" type="text" placeholder="FF:FF:DE:AD:BE:EF" name="mac" value="{{.Mac}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-downspeed">Download Speed</label>
     <input class="form-control" id="basic-form-downspeed" type="text" placeholder="25" name="downspeed" value="{{.Downspeed}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-upspeed">Upload Speed</label>
     <input class="form-control" id="basic-form-upspeed" type="text" placeholder="20" name="upspeed" value="{{.Upspeed}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-burstspeed">Burst Speed</label>
     <input class="form-control" id="basic-form-burstspeed" type="text" placeholder="55" name="burstspeed" value="{{.Burstspeed}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-duration">Burst duration in ms</label>
     <input class="form-control" id="basic-form-duration" type="text" placeholder="999999" name="duration" value="{{.Duration}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-gw">Gateway Address</label>
     <input class="form-control" id="basic-form-gw" type="text" placeholder="192.0.2.1" name="gateway" value="{{.Gateway}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-type">Interface type</label>
     <input class="form-control" id="basic-form-type" type="text" placeholder="PF interface type" name="type" value="{{.Type}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-status">Status</label>
     <select class="form-select" id="basic-form-status" aria-label="Select Type" name="status"/>
       <option selected="selected" value="{{.Status}}">{{.Status}}</option>
       <option value="active">active</option>
       <option value="inactive">inactive</option>
     </select>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-prio">Priority</label>
     <input class="form-control" id="basic-form-prio" type="text" placeholder="0" name="priority" value="{{.Priority}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-pfconfig_id">Router ID</label>
     <input class="form-control" id="basic-form-pfconfig_id" type="text" placeholder="1" name="pfconfig_id" value="{{.PfconfigID}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-due_day">Due day</label>
     <input class="form-control" id="basic-form-due_day" type="text" placeholder="15" name="due_day" value="{{.DueDay}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-later_count">Pay later count</label>
     <input class="form-control" id="basic-form-later_count" type="text" placeholder="0" name="later_count" value="{{.LaterCount}}"/>
   </div>
   <div class="mb-3 form-check">
     <input class="form-check-input" id="basic-form-checkbox" type="checkbox" name="over_due" value="{{.OverDue}}"/>
     <label class="form-check-label" for="basic-form-checkbox">Over due</label>
   </div>
   <button class="btn btn-primary" type="submit">Submit</button>
 </form>
{{end}}
