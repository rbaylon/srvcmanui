{{define "title"}}Subscriber Form{{end}}
{{define "content"}}
 <form method="POST" action="/ui/subs/addorupdate">
   <div class="mb-3">
     <label class="form-label" for="basic-form-created">Date Created</label>
     <input class="form-control" id="basic-form-created" type="datetime-local" name="CreatedAt" value="{{.Record.CreatedAt.Format "2006-01-02T15:04:05"}}"/>
     <input type="hidden" name="ID" value="{{.Record.ID}}" />
     <input type="hidden" name="Downspeed" value="{{.Record.Downspeed}}"/>
     <input type="hidden" name="Upspeed" value="{{.Record.Upspeed}}"/>
     <input type="hidden" name="Burstspeed" value="{{.Record.Burstspeed}}"/>
     <input type="hidden" name="Duration" value="{{.Record.Duration}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-updated">Date updated</label>
     <input class="form-control" id="basic-form-updated" type="datetime-local"  name="UpdatedAt" value="{{.Record.UpdatedAt.Format "2006-01-02T15:04:05"}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-fname">First Name</label>
     <input class="form-control" id="basic-form-fname" type="text" placeholder="First Name" name="FirstName" value="{{.Record.FirstName}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-lname">Last Name</label>
     <input class="form-control" id="basic-form-lname" type="text" placeholder="Last Name" name="LastName" value="{{.Record.LastName}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-loc">Address</label>
     <input class="form-control" id="basic-form-loc" type="text" placeholder="Address" name="Loc" value="{{.Record.Loc}}">
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-ip">IP address</label>
     <input class="form-control" id="basic-form-ip" type="text" placeholder="192.0.2.100" name="FramedIp" value="{{.Record.FramedIp}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-mac">Mac address</label>
     <input class="form-control" id="basic-form-mac" type="text" placeholder="FF:FF:DE:AD:BE:EF" name="Mac" value="{{.Record.Mac}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-gateway">Gateway</label>
     <select class="form-select" id="basic-form-gateway" aria-label="Select Type" name="Gateway"/>
        {{ range .Pfconfigs}}
          {{ range .Ifaces}}
            <option value="{{ .Gateway }}" {{ if eq $.Record.Gateway .Gateway }}selected="selected"{{ end }}>{{ .Gateway }}</option>  
          {{ end }}
        {{ end }}
     </select>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-interface">Interface</label>
     <select class="form-select" id="basic-form-interface" aria-label="Select Type" name="Type"/>
        {{ range .Pfconfigs}}
          {{ range .Ifaces}}
            <option value="{{ .Name }}" {{ if eq $.Record.Type .Name }}selected="selected"{{ end }}>{{ .Name }}</option>  
          {{ end }}
        {{ end }}
     </select>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-status">Status</label>
     <select class="form-select" id="basic-form-status" aria-label="Select Type" name="Status"/>
       <option selected="selected" value="{{.Record.Status}}">{{.Record.Status}}</option>
       <option value="active">active</option>
       <option value="inactive">inactive</option>
     </select>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-plan">Plan</label>
     <select class="form-select" id="basic-form-plan" aria-label="Select Type" name="Plan"/>
      {{ range .Plans}}
        <option value="{{ .Plan }}" {{ if eq $.Record.Plan .Plan }}selected="selected"{{ end }}>{{ .Plan }}</option>
      {{ end }}
     </select>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-prio">Priority</label>
     <input class="form-control" id="basic-form-prio" type="text" placeholder="0" name="Priority" value="{{.Record.Priority}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-pfconfig">Router</label>
     <select class="form-select" id="basic-form-pfconfig" aria-label="Select Type" name="PfconfigID"/>
      {{ range .Pfconfigs}}
        <option value="{{ .ID }}" {{ if eq $.Record.PfconfigID .ID }} selected="selected"{{ end }}>{{ .Router }}</option>
      {{ end }}
     </select>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-due_day">Due day</label>
     <input class="form-control" id="basic-form-due_day" type="text" placeholder="15" name="DueDay" value="{{.Record.DueDay}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-later_count">Pay later count</label>
     <input class="form-control" id="basic-form-later_count" type="text" placeholder="0" name="LaterCount" value="{{.Record.LaterCount}}"/>
   </div>
   <div class="mb-3 form-check">
     <input class="form-check-input" id="basic-form-checkbox" type="checkbox" name="OverDue" value="{{.Record.OverDue}}"/>
     <label class="form-check-label" for="basic-form-checkbox">Over due</label>
   </div>
   <button class="btn btn-primary" type="submit">Submit</button>
 </form>
 <script src="/ui/static/local/fwonchange.js"></script>
{{end}}
