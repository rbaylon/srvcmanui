{{define "title"}}Subscribers List{{end}}
{{define "content"}}
<div class="d-flex align-items-center justify-content-end my-3">
  <div id="bulk-select-replace-element">
    <a href="/ui/subs/create" ><button class="btn btn-phoenix-success btn-sm" type="button"><span class="fas fa-plus" data-fa-transform="shrink-3 down-2"></span><span class="ms-1">New</span></button></a>
  </div>
  <div class="d-none ms-3" id="bulk-select-actions">
    <div class="d-flex">
      <select class="form-select form-select-sm" aria-label="Bulk actions">
        <option selected="selected">Bulk actions</option>
        <option value="Delete">Delete</option>
        <option value="Archive">Archive</option>
      </select>
      <button class="btn btn-phoenix-danger btn-sm ms-2" type="button">Apply</button>
    </div>
  </div>
</div>
<div id="tableExample" data-list='{"valueNames":["id","fname","address","ip","dueday","status","plan"],"page":200,"pagination":false}'>
  <div class="table-responsive mx-n1 px-1">
    <table class="table table-striped table-sm" id="records">
      <thead>
        <tr>
          <th class="white-space-nowrap fs-9 align-middle ps-0" style="max-width:20px; width:18px;">
            <div class="form-check mb-0 fs-8">
              <input class="form-check-input" id="bulk-select-example" type="checkbox" data-bulk-select='{"body":"bulk-select-body","actions":"bulk-select-actions","replacedElement":"bulk-select-replace-element"}' />
            </div>
          </th>
          <th class="sort align-middle" data-sort="id">ID</th>
          <th class="sort align-middle" data-sort="fname">Name</th>
          <th class="sort align-middle" data-sort="address">Address</th>
          <th class="sort align-middle" data-sort="ip">IP</th>
          <th class="sort align-middle" data-sort="ip">GATEWAY</th>
          <th class="sort align-middle" data-sort="dueday">Due Day</th>
          <th class="sort align-middle" data-sort="status">Status</th>
          <th class="sort align-middle" data-sort="plan">Plan</th>
          <th class="sort text-end align-middle pe-0" scope="col">ACTION</th>
        </tr>
      </thead>
      <tbody class="list" id="bulk-select-body">
        {{ range .}}
        <tr>
          <td class="fs-9 align-middle">
            <div class="form-check mb-0 fs-8">
              <input class="form-check-input" type="checkbox" data-bulk-select-row="{&quot;name&quot;:&quot;{{.FirstName}} {{.LastName}}&quot;,&quot;address&quot;:&quot;{{.Loc}}&quot;,&quot;overdue&quot;:{{.OverDue}} }" />
            </div>
          </td>
          <td class="align-middle id">{{.ID}}</td>
          <td class="align-middle fname">{{.FirstName}} {{.LastName}}</td>
          <td class="align-middle address">{{.Loc}}</td>
          <td class="align-middle ip">{{.FramedIp}}</td>
          <td class="align-middle ip">{{.Gateway}}</td>
          <td class="align-middle dueday">{{.DueDay}}</td>
          <td class="align-middle status">{{.Status}}</td>
          <td class="align-middle plan">{{.Plan}}</td>
          <td class="align-middle white-space-nowrap text-end pe-0">
            <div class="btn-reveal-trigger position-static">
              <button class="btn btn-sm dropdown-toggle dropdown-caret-none transition-none btn-reveal fs-10" type="button" data-bs-toggle="dropdown" data-boundary="window" aria-haspopup="true" aria-expanded="false" data-bs-reference="parent"><span class="fas fa-ellipsis-h fs-10"></span></button>
              <div class="dropdown-menu dropdown-menu-end py-2"><a class="dropdown-item" href="{{.ID}}">View</a><a class="dropdown-item" href="#!">Export</a>
                <div class="dropdown-divider"></div><a class="dropdown-item text-danger" href="#!">Remove</a>
              </div>
            </div>
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
<script>
  new DataTable('#records');
</script>
{{end}}
