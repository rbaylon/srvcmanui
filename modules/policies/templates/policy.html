{{define "title"}}Group Form{{end}}
{{define "head_script"}}{{end}}
{{define "content"}}
 <form method="POST" action="/ui/policies/addorupdate">
   <div class="mb-3">
     <input class="form-control" id="basic-form-created" type="hidden" name="CreatedAt" value="{{.Policy.CreatedAt}}"/>
     <input type="hidden" name="ID"/>
   </div>
   <div class="mb-3">
     <input class="form-control" id="basic-form-updated" type="hidden"  name="UpdatedAt" value="{{.Policy.UpdatedAt}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-name">Policy Name</label>
     <input class="form-control" id="basic-form-name" type="text" placeholder="Policy Name" name="Name" value="{{.Policy.Name}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-module">Module</label>
     <input class="form-control" id="basic-form-module" type="text" placeholder="Module name" name="Type" value="{{.Policy.Type}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-resource">Resource</label>
     <input class="form-control" id="basic-form-resource" type="text" placeholder="Resource" name="Resource" value="{{.Policy.Resource}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-permission">Permission</label>
     <select class="form-select" id="basic-form-permission" aria-label="RO for read only, RW for Read+Write" name="Action">
       <option selected="selected" value="{{.Policy.Action}}">{{.Policy.Action}}</option>
       <option value="RO">RO</option>
       <option value="RW">RW</option>
     </select>
   </div>
   <hr>
   <b>Select which groups this profile should apply to.</b><br>
    {{ range $x, $y := .Groups }}
    <input name="Groups" type="checkbox" value="{{$y.Groupname}}" 
    {{range $i, $v := $.Policy.Groups}}
      {{ if eq $v.Groupname $y.Groupname }} checked{{end}}
    {{end}}><label for="Groups">{{$y.Groupname}}</label>&nbsp;
    {{ end }}
    <hr>
   <button class="btn btn-primary" type="submit">Submit</button>
 </form>
{{end}}
{{define "tail_script"}}{{end}}
