{{define "title"}}Sign in{{end}}
{{define "head_script"}}{{end}}
{{define "content"}}
<main class="form-signin">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4 p-sm-5">
      <form method="POST" action="/ui/users/login">
        <h1 class="h3 mb-4 fw-normal text-center">Specz ISP</h1>

        {{ if .Error }}<div class="alert alert-danger py-2 small text-start" role="alert">{{ .Error }}</div>{{ end }}

        <div class="form-floating">
          <input type="text" class="form-control" id="floatingInput" placeholder="username" name="username" value="{{ .Username }}" autocomplete="username">
          <label for="floatingInput">Username</label>
        </div>
        <div class="form-floating">
          <input type="password" class="form-control" id="floatingPassword" placeholder="Password" name="password" autocomplete="current-password">
          <label for="floatingPassword">Password</label>
        </div>
        <div class="text-start mt-3 mb-3">
          <label for="captchaAnswer" class="form-label small text-muted mb-1">Solve to continue (multiply and divide first):</label>
          <div class="input-group">
            <span class="input-group-text fw-bold">{{ .Question }} =</span>
            <input type="text" class="form-control" id="captchaAnswer" name="captcha_answer" inputmode="numeric" pattern="[0-9]+" autocomplete="off" required placeholder="?">
          </div>
          <input type="hidden" name="captcha_token" value="{{ .Token }}">
        </div>

        <div class="checkbox mb-3">
          <label>
            <input type="checkbox" value="remember-me"> Remember me
            <input type="hidden" name="prevurl" value="{{.Prevurl}}"/>
          </label>
        </div>
        <button class="w-100 btn btn-lg btn-primary" type="submit">Sign in</button>
        <p class="mt-4 mb-0 text-muted small text-center">Specz ISP <span id="appver"></span> &copy; 2025</p>
      </form>
    </div>
  </div>
</main>
{{end}}
