{{define "title"}}Service Manager Login{{end}}
{{define "head_script"}}{{end}}
{{define "content"}}
<main class="form-signin">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4 p-sm-5">
      <form method="POST" action="/ui/users/login">
        <h1 class="h3 mb-4 fw-normal text-center">ARKGATE</h1>

        <div class="form-floating">
          <input type="text" class="form-control" id="floatingInput" placeholder="username" name="username">
          <label for="floatingInput">Username</label>
        </div>
        <div class="form-floating">
          <input type="password" class="form-control" id="floatingPassword" placeholder="Password" name="password">
          <label for="floatingPassword">Password</label>
        </div>

        <div class="checkbox mb-3">
          <label>
            <input type="checkbox" value="remember-me"> Remember me
            <input type="hidden" name="prevurl" value="{{.Prevurl}}"/>
          </label>
        </div>
        <button class="w-100 btn btn-lg btn-primary" type="submit">Sign in</button>
        <p class="mt-4 mb-0 text-muted small text-center">arkgate &copy; 2025</p>
      </form>
    </div>
  </div>
</main>
{{end}}
