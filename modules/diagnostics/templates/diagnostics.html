{{define "title"}}Diagnostics{{end}}
{{define "head_script"}}{{end}}
{{define "content"}}
<div class="card shadow-sm my-3">
  <div class="card-header">
    <span data-feather="activity" class="me-1"></span>
    Network Diagnostics
  </div>
  <div class="card-body">
    <form class="row g-2 align-items-end mb-3">
      <div class="col-auto">
        <label class="form-label" for="diag-ip">IP Address</label>
        <input class="form-control" id="diag-ip" type="text" name="ip" value="{{.Ip}}" placeholder="8.8.8.8" pattern="(\d{1,3}\.){3}\d{1,3}|[0-9a-fA-F:]+" required/>
      </div>
      <div class="col-auto">
        <button class="btn btn-primary" type="submit" formaction="/ui/diagnostics/ping" formmethod="GET">Ping</button>
        <button class="btn btn-secondary" type="submit" formaction="/ui/diagnostics/traceroute" formmethod="GET">Traceroute</button>
      </div>
    </form>
    {{ if .Output }}
    <div class="small text-muted mb-1">{{.Action}} {{.Ip}}</div>
    <pre class="p-3 bg-light border rounded mb-0" style="white-space: pre-wrap;">{{.Output}}</pre>
    {{ end }}
  </div>
</div>
{{end}}
{{define "tail_script"}}{{end}}
