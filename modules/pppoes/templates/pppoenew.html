{{define "title"}}PPPOE Form{{end}}
{{define "content"}}
 <form method="POST" action="/ui/firewall/addorupdate">
   <div class="mb-3">
     <input class="form-control" id="basic-form-created" type="hidden" name="CreatedAt"/>
   </div>
   <div class="mb-3">
     <input class="form-control" id="basic-form-updated" type="hidden"  name="UpdatedAt"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-pfconfig">Router</label>
     <select class="form-select" id="basic-form-pfconfig" aria-label="Select Type" name="PfconfigID"/>
      {{ range .Pfconfigs}}
        <option value="{{ .ID }}">{{ .Router }}</option>
      {{ end }}
     </select>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-interface">Device</label>
     <select class="form-select" id="basic-form-interface" aria-label="Select Device" name="Device"/>
     </select>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-protocol">Name</label>
     <input class="form-control" id="basic-form-protocol" type="text" placeholder="tcp" name="Name"/>
   </div>
   <div class="mb-3">  
     <label class="form-label" for="basic-form-source">IP</label>
     <input class="form-control" id="basic-form-source" type="text" placeholder="IP address from device not currently assigned" name="Ip">
   </div>
   <div class="mb-3">  
     <label class="form-label" for="basic-form-destination">Pool range</label>
     <input class="form-control" id="basic-form-destination" type="text" placeholder="ip range in format x.x.x.x-y.y.y.y" name="PoolAddress">
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-dstport">DNS servers</label>
     <input class="form-control" id="basic-form-dstport" type="text" placeholder="space separated dns server ip addresses" name="DnsAddress"/>
   </div>
   <button class="btn btn-primary" type="submit">Submit</button>
 </form>
 <script src="/ui/static/local/fwonload.js"></script>
{{end}}
