{{define "title"}}Plan Form{{end}}
{{define "head_script"}}{{end}}
{{define "content"}}
 <form method="POST" action="/ui/plans/addorupdate">
   <div class="mb-3">
     <input class="form-control" id="basic-form-created" type="hidden" name="CreatedAt" value="{{.CreatedAt.Format "2006-01-02T15:04:05"}}"/>
     <input type="hidden" name="ID" value="{{.ID}}" />
   </div>
   <div class="mb-3">
     <input class="form-control" id="basic-form-updated" type="hidden"  name="UpdatedAt" value="{{.UpdatedAt.Format "2006-01-02T15:04:05"}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-downspeed">Downspeed</label>
     <input class="form-control" id="basic-form-downspeed" type="number" placeholder="20" name="Downspeed" value="{{.Downspeed}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-upspeed">Upload Speed</label>
     <input class="form-control" id="basic-form-upspeed" type="number" placeholder="15" name="Upspeed" value="{{.Upspeed}}">
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-stdown">SpeedTestDownload</label>
     <input class="form-control" id="basic-form-stdown" type="number" placeholder="55" name="SpeedTestDown" value="{{.SpeedTestDown}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-stup">SpeedTestUpload</label>
     <input class="form-control" id="basic-form-stup" type="number" placeholder="30" name="SpeedTestUp" value="{{.SpeedTestUp}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-plan">Plan</label>
     <input class="form-control" id="basic-form-plan" type="text" placeholder="Plan799" name="Plan" value="{{.Plan}}" pattern="[A-Za-z0-9]*" maxlength="100"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-pfconfig_id">Router ID</label>
     <input class="form-control" id="basic-form-pfconfig_id" type="text" placeholder="1" name="PfconfigID" value="{{.PfconfigID}}"/>
   </div>
   <button class="btn btn-primary" type="submit">Submit</button>
 </form>
{{end}}
{{define "tail_script"}}{{end}}
