{{define "title"}}Plan Form{{end}}
{{define "head_script"}}{{end}}
{{define "content"}}
 <div class="row justify-content-center">
  <div class="col-12 col-xl-8">
   <div class="card shadow-sm my-4">
    <div class="card-body p-4">
     <form method="POST" action="/ui/plans/addorupdate">
  {{ if .Record }}
   <div class="mb-3">
     <input class="form-control" id="basic-form-created" type="hidden" name="CreatedAt" value="{{.Record.CreatedAt.Format "2006-01-02T15:04:05"}}"/>
     <input type="hidden" name="ID" value="{{.Record.ID}}" />
   </div>
   <div class="mb-3">
     <input class="form-control" id="basic-form-updated" type="hidden"  name="UpdatedAt" value="{{.Record.UpdatedAt.Format "2006-01-02T15:04:05"}}"/>
   </div>
   {{ end }}
   <div class="mb-3">
     <label class="form-label" for="basic-form-downspeed">Downspeed</label>
     <input class="form-control" id="basic-form-downspeed" type="number" placeholder="20" name="Downspeed" {{ if .Record }} value="{{.Record.Downspeed}}" {{end}}/>
     <div class="form-text">A whole number.</div>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-upspeed">Upload Speed</label>
     <input class="form-control" id="basic-form-upspeed" type="number" placeholder="15" name="Upspeed" {{ if .Record }} value="{{.Record.Upspeed}}" {{end}}>
     <div class="form-text">A whole number.</div>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-stdown">SpeedTestDownload</label>
     <input class="form-control" id="basic-form-stdown" type="number" placeholder="55" name="SpeedTestDown" {{ if .Record }} value="{{.Record.SpeedTestDown}}" {{end}}/>
     <div class="form-text">A whole number.</div>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-stup">SpeedTestUpload</label>
     <input class="form-control" id="basic-form-stup" type="number" placeholder="30" name="SpeedTestUp" {{ if .Record }} value="{{.Record.SpeedTestUp}}" {{end}}/>
     <div class="form-text">A whole number.</div>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-plan">Plan</label>
     <input class="form-control" id="basic-form-plan" type="text" placeholder="Plan799" name="Plan" {{ if .Record }} value="{{.Record.Plan}}" {{end}} pattern="[A-Za-z0-9]*" maxlength="100"/>
     <div class="form-text">Letters and numbers only, no spaces, up to 100 characters.</div>
   </div>
   <div class="mb-3 d-none">
     <label class="form-label" for="basic-form-pfconfig_id">Router</label>
     <select class="form-select" id="basic-form-pfconfig_id" aria-label="Select Router" name="PfconfigID">
     {{ range .Pfconfigs }}
       <option value="{{ .ID }}" {{ if $.Record }}{{ if eq $.Record.PfconfigID .ID }} selected="selected" {{ end }} {{end}}>{{ .Router }}</option>
     {{ end }}
     </select>
   </div>
     <div class="d-grid d-sm-flex justify-content-sm-end mt-4">
       <button class="btn btn-primary" type="submit">Submit</button>
     </div>
    </form>
   </div>
  </div>
 </div>
</div>
{{end}}
{{define "tail_script"}}{{end}}
