{{define "title"}}Plan List{{end}}
{{define "content"}}
<div class="d-flex align-items-center justify-content-end my-3">
  <div id="bulk-select-replace-element">
    <a href="/ui/plans/create" ><button class="btn btn-phoenix-success btn-sm" type="button"><span class="fas fa-plus" data-fa-transform="shrink-3 down-2"></span><span class="ms-1">New</span></button></a>
  </div>
  <div class="d-none ms-3" id="bulk-select-actions">
    <div class="d-flex">
      <select class="form-select form-select-sm" aria-label="Bulk actions">
        <option selected="selected">Bulk actions</option>
        <option value="Delete">Delete</option>
        <option value="Archive">Archive</option>
      </select>
      <button class="btn btn-phoenix-danger btn-sm ms-2" type="button">Apply</button>
    </div>
  </div>
</div>
<div id="tableExample" data-list='{"valueNames":["id","plan","downspeed","upspeed","stdown","stup","pfconfigid"],"page":200,"pagination":false}'>
  <div class="table-responsive mx-n1 px-1">
    <table class="table table-sm border-top border-translucent fs-9 mb-0" id="records">
      <thead>
        <tr>
          <th class="white-space-nowrap fs-9 align-middle ps-0" style="max-width:20px; width:18px;">
            <div class="form-check mb-0 fs-8">
              <input class="form-check-input" id="bulk-select-example" type="checkbox" data-bulk-select='{"body":"bulk-select-body","actions":"bulk-select-actions","replacedElement":"bulk-select-replace-element"}' />
            </div>
          </th>
          <th class="sort align-middle" data-sort="id">ID</th>
          <th class="sort align-middle" data-sort="plan">Plan</th>
          <th class="sort align-middle" data-sort="downspeed">Downspeed</th>
          <th class="sort align-middle" data-sort="upspeed">Upspeed</th>
          <th class="sort align-middle" data-sort="stdown">SpeedTestDown</th>
          <th class="sort align-middle" data-sort="stup">SpeedTestUp</th>
          <th class="sort align-middle" data-sort="pfconfigid">PfconfigID</th>
          <th class="sort text-end align-middle pe-0" scope="col">ACTION</th>
        </tr>
      </thead>
      <tbody class="list" id="bulk-select-body">
        {{ range .}}
        <tr>
          <td class="fs-9 align-middle">
            <div class="form-check mb-0 fs-8">
              <input class="form-check-input" type="checkbox" data-bulk-select-row="{&quot;plan&quot;:&quot;{{.Plan}} }" />
            </div>
          </td>
          <td class="align-middle id">{{.ID}}</td>
          <td class="align-middle plan">{{.Plan}}</td>
          <td class="align-middle downspeed">{{.Downspeed}}</td>
          <td class="align-middle upspeed">{{.Upspeed}}</td>
          <td class="align-middle stdown">{{.SpeedTestDown}}</td>
          <td class="align-middle stup">{{.SpeedTestUp}}</td>
          <td class="align-middle pfconfigid">{{.PfconfigID}}</td>
          <td class="align-middle white-space-nowrap text-end pe-0">
            <div class="btn-reveal-trigger position-static">
              <button class="btn btn-sm dropdown-toggle dropdown-caret-none transition-none btn-reveal fs-10" type="button" data-bs-toggle="dropdown" data-boundary="window" aria-haspopup="true" aria-expanded="false" data-bs-reference="parent"><span class="fas fa-ellipsis-h fs-10"></span></button>
              <div class="dropdown-menu dropdown-menu-end py-2"><a class="dropdown-item" href="{{.ID}}">Edit</a>
                <div class="dropdown-divider"></div><a class="dropdown-item text-danger" onclick="confirmDelete('/ui/plans/delete/{{.ID}}')" href="#!">Remove</a>
              </div>
            </div>
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
<script>
  new DataTable('#records');
</script>
<script src="/ui/static/local/listutils.js"></script>
{{end}}
