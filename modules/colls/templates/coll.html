{{define "title"}}Subscriber Form{{end}}
{{define "head_script"}}{{end}}
{{define "content"}}
 <form method="POST" action="/ui/collections/addorupdate">
   <div class="mb-3">
     <label class="form-label" for="basic-form-created">Date Created</label>
     <input class="form-control" id="basic-form-created" type="datetime-local" name="CreatedAt" value="{{.CreatedAt.Format "2006-01-02T15:04:05"}}"/>
     <input type="hidden" name="ID" value="{{.ID}}" />
     <input type="hidden" name="SubName" value="{{.SubName}}" />
     <input type="hidden" name="SubDue" value="{{.SubDue}}" />
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-updated">Date updated</label>
     <input class="form-control" id="basic-form-updated" type="datetime-local" name="UpdatedAt" value="{{.UpdatedAt.Format "2006-01-02T15:04:05"}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-year">Year</label>
     <input class="form-control" id="basic-form-year" type="text" placeholder="Year" name="Year" value="{{.Year}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-jan">Jan</label>
     <input class="form-control" id="basic-form-jan" type="text" placeholder="0" name="Jan" value="{{.Jan}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-feb">Feb</label>
     <input class="form-control" id="basic-form-feb" type="text" placeholder="0" name="Feb" value="{{.Feb}}"/>
   </div>
      <div class="mb-3">
     <label class="form-label" for="basic-form-mar">Mar</label>
     <input class="form-control" id="basic-form-mar" type="text" placeholder="0" name="Mar" value="{{.Mar}}"/>
   </div>
      <div class="mb-3">
     <label class="form-label" for="basic-form-apr">Apr</label>
     <input class="form-control" id="basic-form-apr" type="text" placeholder="0" name="Apr" value="{{.Apr}}"/>
   </div>
      <div class="mb-3">
     <label class="form-label" for="basic-form-may">May</label>
     <input class="form-control" id="basic-form-may" type="text" placeholder="0" name="May" value="{{.May}}"/>
   </div>
      <div class="mb-3">
     <label class="form-label" for="basic-form-jun">Jun</label>
     <input class="form-control" id="basic-form-jun" type="text" placeholder="0" name="Jun" value="{{.Jun}}"/>
   </div>
      <div class="mb-3">
     <label class="form-label" for="basic-form-jul">Jul</label>
     <input class="form-control" id="basic-form-jul" type="text" placeholder="0" name="Jul" value="{{.Jul}}"/>
   </div>
      <div class="mb-3">
     <label class="form-label" for="basic-form-aug">Aug</label>
     <input class="form-control" id="basic-form-aug" type="text" placeholder="0" name="Aug" value="{{.Aug}}"/>
   </div>
      <div class="mb-3">
     <label class="form-label" for="basic-form-sep">Sep</label>
     <input class="form-control" id="basic-form-sep" type="text" placeholder="0" name="Sep" value="{{.Sep}}"/>
   </div>
      <div class="mb-3">
     <label class="form-label" for="basic-form-oct">Oct</label>
     <input class="form-control" id="basic-form-oct" type="text" placeholder="0" name="Oct" value="{{.Oct}}"/>
   </div>
      <div class="mb-3">
     <label class="form-label" for="basic-form-nov">Nov</label>
     <input class="form-control" id="basic-form-nov" type="text" placeholder="0" name="Nov" value="{{.Nov}}"/>
   </div>
      <div class="mb-3">
     <label class="form-label" for="basic-form-dec">Dec</label>
     <input class="form-control" id="basic-form-dec" type="text" placeholder="0" name="Dec" value="{{.Dec}}"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-subid">SubID</label>
     <input class="form-control" id="basic-form-subid" type="text" placeholder="0" name="SubID" value="{{.SubID}}"/>
   </div>
   <button class="btn btn-primary" type="submit">Submit</button>
 </form>
{{end}}
