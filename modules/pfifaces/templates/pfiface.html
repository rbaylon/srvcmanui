{{define "title"}}Plan Form{{end}}
{{define "head_script"}}{{end}}
{{define "content"}}
<br>
 <form method="POST" action="/ui/pfifaces/addorupdate">
  {{ if .Record }}
   <div class="mb-3">
     <input class="form-control" id="basic-form-created" type="hidden" name="CreatedAt" value="{{.Record.CreatedAt.Format "2006-01-02T15:04:05"}}"/>
     <input type="hidden" name="ID" value="{{.Record.ID}}" />  
   </div>
   <div class="mb-3">
     <input class="form-control" id="basic-form-updated" type="hidden"  name="UpdatedAt" value="{{.Record.UpdatedAt.Format "2006-01-02T15:04:05"}}"/>
   </div>
   {{ end }}
   <div class="mb-3">
     <label class="form-label" for="basic-form-downspeed">Name</label>
     <input class="form-control" id="basic-form-downspeed" type="text" placeholder="" name="Name" {{ if .Record }} value="{{.Record.Name}}" {{end}} pattern="[A-Za-z0-9]*" maxlength="100"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-device">Device</label>
     <input class="form-control" id="basic-form-device" type="text" placeholder="" name="Device" {{ if .Record }} value="{{.Record.Device}}" {{end}} pattern="[A-Za-z0-9]*" maxlength="100">
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-speed">Link Speed</label>
     <input class="form-control" id="basic-form-speed" type="text" placeholder="900M" name="Speed" {{ if .Record }} value="{{.Record.Speed}}" {{end}} pattern="[A-Za-z0-9]*" maxlength="100">
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-ip">IP Address</label>
     <input class="form-control" id="basic-form-ip" type="text" placeholder="" name="Ip" {{ if .Record }} value="{{.Record.Ip}}" {{end}} pattern="(\d{1,3}\.){3}\d{1,3}|[0-9a-fA-F:]+"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-netmask">Netmask</label>
     <input class="form-control" id="basic-form-netmask" type="text" placeholder="" name="Netmask" {{ if .Record }} value="{{.Record.Netmask}}" {{end}} pattern="(\d{1,3}\.){3}\d{1,3}|[0-9a-fA-F:]+"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-gw">Gateway</label>
     <input class="form-control" id="basic-form-gw" type="text" placeholder="" name="Gateway" {{ if .Record }} value="{{.Record.Gateway}}" {{end}} pattern="(\d{1,3}\.){3}\d{1,3}|[0-9a-fA-F:]+">
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-type">Type</label>
     <select class="form-select" id="basic-form-type" aria-label="Select Type" name="Type"/>
       {{ if .Record }} <option selected="selected" value="{{.Record.Type}}">{{.Record.Type}}</option> {{end}}
       <option value="internal">internal</option>
       <option value="external">external</option>
     </select>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-lb">Load Balance Percentage</label>
     <input class="form-control" id="basic-form-lb" type="number" placeholder="" name="LbPercentage" {{ if .Record }} value="{{.Record.LbPercentage}}" {{end}} min="0" max="100"/>
   </div>
   <div class="mb-3">
     <input class="form-check-input" id="basic-form-default" type="checkbox" name="Default" value="true" {{ if .Record }} {{ if .Record.Default }}checked{{ end }} {{end}}/>
     <label class="form-check-label" for="basic-form-default">Default Gateway</label>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-pfconfig">Router</label>
     <select class="form-select" id="basic-form-pfconfig" aria-label="Select Type" name="PfconfigID"/>
     {{ range .Pfconfigs }}
       <option value="{{ .ID }}" {{ if $.Record }}{{ if eq $.Record.PfconfigID .ID }} selected="selected" {{ end }} {{end}}>{{ .Router }}</option>
     {{ end }}
     </select>
   </div>
   <button class="btn btn-primary" type="submit">Submit</button>
 </form>
{{end}}
{{define "tail_script"}}{{end}}
