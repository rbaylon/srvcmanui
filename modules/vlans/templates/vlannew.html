{{define "title"}}Firewall Form{{end}}
{{define "head_script"}}{{end}}
{{define "content"}}
 <div class="row justify-content-center">
  <div class="col-12 col-xl-8">
   <div class="card shadow-sm my-4">
    <div class="card-body p-4">
     <form method="POST" action="/ui/vlan/addorupdate">
   <div class="mb-3">
     <input class="form-control" id="basic-form-created" type="hidden" name="CreatedAt"/>
   </div>
   <div class="mb-3">
     <input class="form-control" id="basic-form-updated" type="hidden"  name="UpdatedAt"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-name">Name</label>
     <input class="form-control" id="basic-form-name" type="text" placeholder="interface name" name="Name" pattern="[A-Za-z0-9]*" maxlength="100"/>
     <div class="form-text">Letters and numbers only, no spaces, up to 100 characters.</div>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-vlantag">VLAN ID</label>
     <input class="form-control" id="basic-form-vlantag" type="number" placeholder="1-4094" name="VlanTag" min="1" max="4094">
     <div class="form-text">A whole number between 1 and 4094.</div>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-pfifaces">Parent Device</label>
     <select class="form-select" id="basic-form-pfifaces" aria-label="Select Parent Interface" name="ParentDevice"/>
      {{ range .Pfifaces}}
        <option value="{{ .Device }}">{{ .Device }}</option>
      {{ end }}
     </select>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-rxprio">Priority (Receive)</label>
     <select class="form-select" id="basic-form-rxprio" aria-label="Select Priority" name="RxPrio"/>
       <option value="0">0</option>
       <option value="1">1</option>
       <option value="2">2</option>
       <option value="3">3</option>
       <option value="4">4</option>
       <option value="5">5</option>
       <option value="6">6</option>
       <option value="7">7</option>
     </select>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-txprio">Priority (Transmit)</label>
     <select class="form-select" id="basic-form-txprio" aria-label="Select Priority" name="TxPrio"/>
       <option value="0">0</option>
       <option value="1">1</option>
       <option value="2">2</option>
       <option value="3">3</option>
       <option value="4">4</option>
       <option value="5">5</option>
       <option value="6">6</option>
       <option value="7">7</option>
     </select>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-pfconfig">Router</label>
     <select class="form-select" id="basic-form-pfconfig" aria-label="Select Type" name="PfconfigID"/>
      {{ range .Pfconfigs}}
        <option value="{{ .ID }}">{{ .Router }}</option>
      {{ end }}
     </select>
   </div>
     <div class="d-grid d-sm-flex justify-content-sm-end mt-4">
       <button class="btn btn-primary" type="submit">Submit</button>
     </div>
    </form>
   </div>
  </div>
 </div>
</div>
{{end}}
{{define "tail_script"}}{{end}}
