{{define "title"}}Firewall Rules{{end}}
{{define "head_script"}}{{end}}
{{define "content"}}
<div class="card shadow-sm my-3">
  <div class="card-header d-flex align-items-center justify-content-between">
    <h5 class="mb-0">Firewall Rules</h5>
    <a href="/ui/firewall/create" class="btn btn-success btn-sm"><span data-feather="plus"></span> New</a>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-striped table-hover table-sm align-middle mb-0" id="records">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Filter Rule</th>
            <th scope="col" class="text-end">Action</th>
          </tr>
        </thead>
        <tbody>
          {{ range .}}
          <tr>
            <td>{{ .ID }}</td>
            <td>{{ .Rule }}</td>
            <td class="text-end">
              <a href="{{.ID}}" class="btn btn-sm btn-outline-secondary" title="Edit"><span data-feather="edit"></span></a>
              <a href="#" onclick="confirmDelete('/ui/firewall/delete/{{.ID}}')" class="btn btn-sm btn-outline-danger" title="Delete"><span data-feather="x-square"></span></a>
            </td>
          </tr>
          {{ end }}
        </tbody>
      </table>
    </div>
  </div>
</div>
<script src="/ui/static/local/listutils.js"></script>
{{end}}
{{define "tail_script"}}{{end}}
