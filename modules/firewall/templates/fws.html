{{define "title"}}Firewall List{{end}}
{{define "content"}}
      <h2>Section title</h2>
      <div class="table-responsive">
        <table class="table table-striped table-sm">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Filter Rule</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody>
            {{ range .}}
            <tr>
              <td>{{ .ID }}</td>
              <td>{{ .Rule }}</td>
              <td><span data-feather="edit"></span> | <span data-feather="x-square"></span></td>
            </tr>
            {{ end }}
          </tbody>
        </table>
      </div>
{{end}}
