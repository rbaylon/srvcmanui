{{define "title"}}Firewall Rules{{end}}
{{define "content"}}
<div class="d-flex align-items-center justify-content-end my-3">
  <div id="bulk-select-replace-element">
    <a href="/ui/firewall/create" ><button class="btn btn-phoenix-success btn-sm" type="button"><span data-feather="plus">New</span></button></a>
  </div>
</div>
      <h2>Firewall Rules</h2>
      <div class="table-responsive">
        <table class="table table-striped table-sm" id="records">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Filter Rule</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody>
            {{ range .}}
            <tr>
              <td>{{ .ID }}</td>
              <td>{{ .Rule }}</td>
              <td><span data-feather="edit"></span> | <span data-feather="x-square"></span></td>
            </tr>
            {{ end }}
          </tbody>
        </table>
      </div>
<script>
  new DataTable('#records');
</script>
{{end}}
