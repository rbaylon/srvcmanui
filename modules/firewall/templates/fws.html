{{define "title"}}Firewall List{{end}}
{{define "content"}}
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
      <h2>Section title</h2>
      <div class="table-responsive">
        <table class="table table-striped table-sm">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Filter Rule</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody>
            {{ range .}}
            <tr>
              <td>{{ .ID }}</td>
              <td>{{ .Rule }}</td>
              <td><span data-feather="pencil"></span> | <span data-feather="trash"></span></td>
            </tr>
            {{ end }}
          </tbody>
        </table>
      </div>
    </main>
{{end}}
