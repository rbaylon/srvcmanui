{{define "title"}}Dashboard{{end}}
{{define "content"}}
<br>
<div class="card text-white bg-primary mb-3" style="max-width: 18rem;">
  <div class="card-header">System Info</div>
  <div class="card-body">
    <table class="table">
      <tr><td>CPU Available</td><td>{{ .cpuusage }}%</td></tr>
      <tr><td>CPU Temperature</td><td>{{ .cputemp }}&deg;C</td></tr>
      <tr><td>Globe Active Subs</td><td>{{ .gwsubs.globe }}</td></tr>
      <tr><td>PLDT Active Subs</td><td>{{ .gwsubs.pldt }}</td></tr>
      <tr><td>Converge Active Subs</td><td>{{ .gwsubs.converge }}</td></tr>
    </table>
  </div>
</div>
{{end}}
