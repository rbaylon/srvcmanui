{{define "title"}}Dashboard{{end}}
{{define "content"}}
<br>
<div class="card text-white bg-primary mb-3" style="max-width: 18rem;">
  <div class="card-header">System Info</div>
  <div class="card-body">
    <h5 class="card-title">CPU Usage: {{ .cpuusage }}</h5>
    <p class="card-text">CPU Temperature: {{ .cputemp }}</p>
    <p class="card-text">Globe Active Subs: {{ .gwsubs.globe }}</p>
    <p class="card-text">PLDT Active Subs: {{ .gwsubs.pldt }}</p>
    <p class="card-text">Converge Active Subs: {{ .gwsubs.converge }}</p>
  </div>
</div>
{{end}}
