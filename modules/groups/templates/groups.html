{{define "title"}}Groups{{end}}
{{define "head_script"}}{{end}}
{{define "content"}}
<div class="card shadow-sm my-3">
  <div class="card-header d-flex align-items-center justify-content-between">
    <h5 class="mb-0">Groups</h5>
    <a href="/ui/groups/create" class="btn btn-success btn-sm"><span data-feather="plus"></span> New</a>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-striped table-hover table-sm align-middle mb-0" id="records">
      <thead>
        <tr>
          <th class="sort align-middle" data-sort="id">ID</th>
          <th class="sort align-middle" data-sort="group">Group</th>
          <th class="sort text-end align-middle pe-0" scope="col">ACTION</th>
        </tr>
      </thead>
      <tbody class="list" id="bulk-select-body">
        {{ range .}}
        <tr>
          <td class="align-middle id">{{.ID}}</td>
          <td class="align-middle firstname">{{.Groupname}} </td>
          <td class="text-end">
            <a href="{{.ID}}" class="btn btn-sm btn-outline-secondary" title="Edit"><span data-feather="edit"></span></a>
            <a href="#" onclick="confirmDelete('/ui/groups/delete/{{.ID}}')" class="btn btn-sm btn-outline-danger" title="Delete"><span data-feather="x-square"></span></a>
          </td>
        </tr>
        {{end}}
      </tbody>
      </table>
    </div>
  </div>
</div>
<script src="/ui/static/local/listutils.js"></script>
{{end}}
{{define "tail_script"}}{{end}}
