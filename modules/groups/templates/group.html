{{define "title"}}Group Form{{end}}
{{define "head_script"}}{{end}}
{{define "content"}}
 <form method="POST" action="/ui/groups/addorupdate">
   <div class="mb-3">
     <input class="form-control" id="basic-form-created" type="hidden" name="CreatedAt" value="{{.CreatedAt}}"/>
     <input type="hidden" name="ID" value="{{.ID}}"/>
   </div>
   <div class="mb-3">
     <input class="form-control" id="basic-form-updated" type="hidden"  name="UpdatedAt"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-group">Group Name</label>
     <input class="form-control" id="basic-form-group" type="text" placeholder="Group Name" name="Groupname" value="{{.Groupname}}" required pattern="[A-Za-z0-9]+" maxlength="100"/>
     <div class="form-text">Required. Letters and numbers only, no spaces, up to 100 characters.</div>
   </div>
   <button class="btn btn-primary" type="submit">Submit</button>
 </form>
{{end}}
{{define "tail_script"}}{{end}}
