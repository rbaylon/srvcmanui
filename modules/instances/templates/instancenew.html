{{define "title"}}Instance Form{{end}}
{{define "content"}}
 <form method="POST" action="/ui/instances/addorupdate">
   <div class="mb-3">
     <input class="form-control" id="basic-form-created" type="hidden" name="CreatedAt"/>
   </div>
   <div class="mb-3">
     <input class="form-control" id="basic-form-updated" type="hidden"  name="UpdatedAt"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-router">Router</label>
     <input class="form-control" id="basic-form-router" type="text" placeholder="instance name" name="Router"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-worker">Worker Name</label>
     <input class="form-control" id="basic-form-worker" type="text" placeholder="Worker name" name="Workername"/>
   </div>
   <div class="mb-3">  
     <label class="form-label" for="basic-form-wifilist">WifiIpList</label>
     <input class="form-control" id="basic-form-source" type="text" placeholder="path to wifi clients list" name="WifiIpList">
   </div>
   <div class="mb-3">  
     <label class="form-label" for="basic-form-subslist">SubsIpList</label>
     <input class="form-control" id="basic-form-subslist" type="text" placeholder="path to subscribers list" name="SubsIpList">
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-dns">DNS servers</label>
     <input class="form-control" id="basic-form-dns" type="text" placeholder="space separated dns server ip addresses" name="Dns"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-captiveportal">Captive Portal Port</label>
     <input class="form-control" id="basic-form-captiveportal" type="text" placeholder="captive portal port" name="CaptivePortalPort"/>
   </div>
   <div class="mb-3">
     <label class="form-label" for="basic-form-subsportal">Subscribers Portal Port</label>
     <input class="form-control" id="basic-form-subsportal" type="text" placeholder="subscribers portal port" name="SubsPortalPort"/>
   </div>
   <div class="mb-3 form-check">
     <input class="form-check-input" id="basic-form-lb" type="checkbox" name="LoadBalance"/>
     <label class="form-check-label" for="basic-form-lb">Enable Load Balancer</label>
   </div>
   <button class="btn btn-primary" type="submit">Submit</button>
 </form>
{{end}}
