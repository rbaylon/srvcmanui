name: srvcman UI Workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: copy env file
        run: cp /home/odracirb2/srvcmanuienv/.env .

      - name: copy id file
        run: cp /home/odracirb2/.ssh/id_rsa .
        
      - name: bring down existing container
        run: docker compose down

      - name: Run care API in docker
        run: docker compose up --build -d

      - name: Show container logs
        run: docker logs srvcmanui

      - name: delete id file 
        run: rm -fv id_rsa
