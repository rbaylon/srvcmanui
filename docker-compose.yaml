services:
  srvcmanui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srvcmanui
    ports:
      - "8084:8000" # Maps port 8080 on your host to port 80 on the container
    volumes:
      - ./.env:/build/.env:ro # Mount your static HTML directory
    environment:
      - VIRTUAL_HOST=devui.arkgate.space
      - VIRTUAL_PORT=8000
      - LETSENCRYPT_HOST=devui.arkgate.space
    networks:
      - nginx-reverse-proxy

networks:
  nginx-reverse-proxy:
    external: true
